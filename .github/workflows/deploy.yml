name: Deploy Pokéclicker

on:
  workflow_dispatch: # Allows you to trigger this manually

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build game files
        run: npm run website

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # Pokéclicker compiles its website into the docs folder
          branch: gh-pages # This will overwrite your gh-pages branch with just the game files
